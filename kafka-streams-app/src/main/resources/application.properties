
spring.application.name=kafka-streams-app
server.port=8085

# Declaration explicite des binders
spring.cloud.stream.binders.kafka.type=kafka
spring.cloud.stream.binders.kstream.type=kstream

# Configuration Kafka Binder
spring.cloud.stream.binders.kafka.environment.spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.binders.kafka.environment.spring.cloud.stream.kafka.binder.auto-create-topics=true

# Configuration Kafka Streams Binder
spring.cloud.stream.binders.kstream.environment.spring.cloud.stream.kafka.streams.binder.brokers=localhost:9092

# Default Binder
spring.cloud.stream.default-binder=kafka

# Functions
spring.cloud.function.definition=messageConsumer;messageSupplier;pageEventAnalytics;analyticsConsumer

# Consumer R1
spring.cloud.stream.bindings.messageConsumer-in-0.destination=R1
spring.cloud.stream.bindings.messageConsumer-in-0.group=tp4-consumer-group
spring.cloud.stream.bindings.messageConsumer-in-0.binder=kafka

# Supplier R2
spring.cloud.stream.bindings.messageSupplier-out-0.destination=R2
spring.cloud.stream.bindings.messageSupplier-out-0.binder=kafka
spring.cloud.stream.bindings.messageSupplier-out-0.content-type=application/json

# Poller
spring.integration.poller.fixed-delay=1000

# Kafka Streams Input
spring.cloud.stream.bindings.pageEventAnalytics-in-0.destination=R2
spring.cloud.stream.bindings.pageEventAnalytics-in-0.binder=kstream

# Kafka Streams Output
spring.cloud.stream.bindings.pageEventAnalytics-out-0.destination=R3
spring.cloud.stream.bindings.pageEventAnalytics-out-0.binder=kstream

# Kafka Streams Application ID
spring.cloud.stream.kafka.streams.bindings.pageEventAnalytics-in-0.consumer.application-id=tp4-analytics

# Input Serialization
spring.cloud.stream.kafka.streams.bindings.pageEventAnalytics-in-0.consumer.keySerde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.pageEventAnalytics-in-0.consumer.valueSerde=org.springframework.kafka.support.serializer.JsonSerde

# Output Serialization
spring.cloud.stream.kafka.streams.bindings.pageEventAnalytics-out-0.producer.keySerde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.pageEventAnalytics-out-0.producer.valueSerde=org.apache.kafka.common.serialization.Serdes$LongSerde

# Kafka Streams Configuration
spring.cloud.stream.kafka.streams.binder.configuration.spring.json.value.default.type=ma.emsi.kafkastreamsapp.entities.PageEvent
spring.cloud.stream.kafka.streams.binder.configuration.spring.json.trusted.packages=ma.emsi.kafkastreamsapp.entities
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
spring.cloud.stream.kafka.streams.binder.configuration.replication.factor=1
spring.cloud.stream.kafka.streams.binder.configuration.statestore.cache.max.bytes=0


# Analytics Result Consumer
spring.cloud.stream.bindings.analyticsConsumer-in-0.destination=R3
spring.cloud.stream.bindings.analyticsConsumer-in-0.binder=kafka

# Native Kafka Deserialization
spring.cloud.stream.bindings.analyticsConsumer-in-0.consumer.use-native-decoding=true

spring.cloud.stream.kafka.bindings.analyticsConsumer-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.cloud.stream.kafka.bindings.analyticsConsumer-in-0.consumer.configuration.value.deserializer=org.apache.kafka.common.serialization.LongDeserializer

spring.cloud.stream.kafka.bindings.analyticsConsumer-in-0.consumer.start-offset=earliest
